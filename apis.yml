name: AI Fleet
description: >-
  Aifleet (aifleet.com) is a technology-driven, full-stack trucking carrier
  founded in 2020 and headquartered in Austin, Texas. The company describes
  itself as the first full-stack, AI-driven carrier, pairing company drivers
  with proprietary AI algorithms and its own Transportation Management System
  (TMS) to optimize truck utilization, routing, load matching, fuel usage, and
  scheduling across the roughly $400B U.S. freight sector. Aifleet emphasizes a
  driver-centric model — better pay, predictable schedules, and reduced wait
  times — alongside shipper-facing services with proactive tracking updates and
  predictive ETAs. It has raised roughly $50M since founding (Series A 2021,
  venture round 2023, Series B 2024) from investors including Obvious Ventures,
  Ibex Investors, Volvo Group Venture Capital, Compound, and Heron Rock. Aifleet
  is a logistics service provider rather than a developer-facing API platform;
  as of this profile it publishes no public API, developer portal, SDKs, or
  OpenAPI definition.
